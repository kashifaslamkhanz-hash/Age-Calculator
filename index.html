<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple calculator for finding your exact age."
    />
    <title>Age Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="calculator-card" aria-labelledby="page-title">
        <div class="heading">
          <span class="icon" aria-hidden="true">⌛</span>
          <div>
            <p class="eyebrow">QUICK &amp; SIMPLE</p>
            <h1 id="page-title">Age Calculator</h1>
          </div>
        </div>

        <p class="intro">Enter your date of birth to see your exact age today.</p>

        <form id="age-form" novalidate>
          <label for="birth-date">Date of birth</label>
          <input id="birth-date" name="birth-date" type="date" required />
          <p id="message" class="message" aria-live="polite"></p>

          <div class="button-row">
            <button class="calculate-button" type="submit">Calculate Age</button>
            <button class="reset-button" type="button" id="reset-button">Reset</button>
          </div>
        </form>

        <section id="result" class="result" hidden aria-live="polite">
          <p class="result-label">You are</p>
          <div class="age-values">
            <div class="age-part"><strong id="years">0</strong><span>Years</span></div>
            <div class="age-part"><strong id="months">0</strong><span>Months</span></div>
            <div class="age-part"><strong id="days">0</strong><span>Days</span></div>
          </div>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
